name: Feature request
description: Suggest a protocol, import format, authentication method, or workflow.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should TunnelMint solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: input
    id: ecosystem
    attributes:
      label: Protocol, vendor, or configuration format
      placeholder: "For example: PKCS#12, EAP-TLS, or OpenConnect"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This request contains no credentials, keys, certificates, private configuration, or internal network details.
          required: true
