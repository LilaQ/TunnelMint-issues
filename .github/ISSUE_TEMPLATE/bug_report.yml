name: Bug report
description: Report a reproducible TunnelMint problem without sharing secrets.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve TunnelMint. Never paste passwords, private keys, certificates, full VPN configurations, recovery codes, or unredacted logs here.
  - type: input
    id: version
    attributes:
      label: TunnelMint version
      placeholder: "0.1.0 (1)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.x, Apple silicon"
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Connection engine
      options:
        - WireGuard
        - OpenVPN
        - IKEv2 / IPsec
        - Cisco IPsec / XAuth
        - SSTP
        - Import / profile management
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use fictional or redacted names and addresses.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: redaction
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, keys, certificates, tokens, private addresses, internal hostnames, and personal data.
          required: true
